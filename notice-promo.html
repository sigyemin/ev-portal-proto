<body>
<div id="header-slot"></div>
<div class="contents-wrapper">
        <!-- 상단 공통 영역 -->

          <div class="page-header__inner">
            <!-- breadcrumb -->
            <nav class="breadcrumb">
              <ol class="breadcrumb__list">

                  <a href="index.html" class="breadcrumb__link">

                    <span class="hidden">홈</span>

                <li class="breadcrumb__item">

                    <span>소통·지원</span>
                  </a>
                </li>
                <li class="breadcrumb__item">
                  <a href="#" class="breadcrumb__link">
                    <span>알림·공지</span>
                  </a>
                </li>
                <li class="breadcrumb__item">
                  <a href="#" class="breadcrumb__link">
                    <span>홍보자료</span>

            </nav>
            <!-- subject  -->
            <div class="page-header__subject">
              <h1 class="heading-subject">홍보자료</h1>
              <p class="page-header__description">무공해차 전환을 알리는 영상·카드뉴스·캠페인 등 홍보자료를 제공합니다. 자유롭게 활용하실 수 있습니다.</p>
            </div>

        </div>
        <!-- 하단 각 페이지별 컨텐츠 -->
        <div class="contents">
            <div class="board-wrapper">
              <!-- 게시판 검색폼 -->
              <div class="board-search">
                <!-- 검색폼 -->
                <div class="search-form">
                  <div class="search-form__elements">
                    <!-- 폼 항목 -->
                    <div class="element-group">
                      <div class="element-group__label">
                        <label for="searchBoardItem02" class="element-label">기간</label>
                      </div>
                      <div class="element-group__control">
                        <select id="searchBoardItem02" class="select">
                          <option value="">전체</option>
                        </select>
                      </div>
                    </div>
                    <!-- //폼 항목 -->
                    <!-- 폼 항목 -->
                    <div class="element-group element-group--keyword">
                      <div class="element-group__label">
                        <label for="searchBoardItem03" class="element-label">검색어</label>
                      </div>
                      <div class="element-group__control">
                        <input type="text" id="searchBoardItem03" placeholder="검색어 입력" class="text-input" />
                      </div>
                    </div>
                    <!-- //폼 항목 -->
                  </div>
                  <div class="search-form__actions">
                    <button type="button" class="button button--primary button--search">
                      <span class="button__label">검색</span>
                    </button>
                    <button type="button" class="button button--secondary button--reset">
                      <span class="button__label">초기화</span>
                    </button>
                  </div>
                </div>
                <!-- //검색폼 -->
              </div>
              <!-- //게시판 검색폼 -->
              <!-- 게시판 도구모음 -->
              <div class="board-toolbar">
                <div class="board-toolbar__total">
                  <p class="total-number">총 <b class="total-number__total">0</b>건</p>
                </div>
                <div class="board-toolbar__options">
                  <div class="radios">
                    <div class="radio radio--chip">
                      <input type="radio" id="listTypeRow" name="listType" class="radio__input" />
                      <label for="listTypeRow" class="radio__label">
                        <i class="svg-icon type-row" aria-hidden="true"></i>
                        <span>표형</span>
                      </label>
                    </div>
                    <div class="radio radio--chip">
                      <input type="radio" id="listTypeColumn" name="listType" checked class="radio__input" />
                      <label for="listTypeColumn" class="radio__label">
                        <i class="svg-icon type-column" aria-hidden="true"></i>
                        <span>카드형</span>
                      </label>
                    </div>
                  </div>
                </div>
              </div>
              <!-- //게시판 도구모음 -->
              <!-- 게시판 목록 : 보기타입(보이지 않는 타입에는 is-hidden 클래스 추가, aria-hidden 값 변경) -->
              <div class="board-list">
                <!-- 표형 -->
                <div id="myGrid" class="ag-grid ag-theme-ev is-hidden" aria-hidden="true"></div>
                <!-- 카드형 -->
                <ul class="column-list" aria-hidden="false"></ul>
              </div>
              <!-- //게시판 목록 -->
              <!-- 페이징 -->
              <div class="pagination pc-only">
                <button type="button" class="pagination__button">
                  <i class="svg-icon arrow-first"></i>
                  <span class="ir-pm">첫 페이지</span>
                </button>
                <button type="button" class="pagination__button">
                  <i class="svg-icon arrow-prev"></i>
                  <span class="ir-pm">이전</span>
                </button>
                <div class="pagination__list"></div>
                <button type="button" class="pagination__button">
                  <i class="svg-icon arrow-next"></i>
                  <span class="ir-pm">다음</span>
                </button>
                <button type="button" class="pagination__button">
                  <i class="svg-icon arrow-last"></i>
                  <span class="ir-pm">마지막 페이지</span>
                </button>
              </div>
              <!-- 모바일 전용 -->
              <div class="pagination pagination--fraction">
                <button type="button" class="pagination__button">
                  <i class="svg-icon arrow-prev"></i>
                  <span>이전</span>
                </button>
                <div class="pagination__text">
                  <span class="pagination__current">1</span>
                  <span class="pagination__total">1</span>
                </div>
                <button type="button" class="pagination__button">
                  <span>다음</span>
                  <i class="svg-icon arrow-next"></i>
                </button>
              </div>
              <!-- //페이징 -->
            </div>

            
         </div>
      </div>

<script type="application/json" id="pageInfo"></script>

<script src="assets/js/board-grid.js?v=20260827a"></script>
<script>
$(function () {
  var gridApi = null;      // 표형은 최초 전환 시 지연 생성 (숨김 상태 초기화 시 컬럼폭 0 방지)
  var lastList = [];
  var curPage = 1;
  var PER_PAGE = 12;
  var VIEW_URL = '/board/generalView.do';
  var THUMB_URL = '/file/viewImage2.do';

  
  // 검색조건 복원 상수: 컨트롤러 pageInfo 직렬화에서 획득
  var PAGE_INFO = (function() {
    try { return JSON.parse(document.getElementById('pageInfo').textContent) || {}; } catch (e) { return {}; }
  })();
  var initPage = Number(PAGE_INFO.curPage) || 1;
  var initSearch = PAGE_INFO.searchValue || '';

  // 바이트 → 표시용 용량
  function formatBytes(bytes) {
    var n = Number(bytes) || 0;
    if (n <= 0) return '-';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // 유튜브 URL → 영상 ID (기존 promo 화면 로직 유지)
  function extractVideoId(url) {
    var regex = /^(?:https?:\/\/)?(?:www\.|m\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/;
    var match = String(url || '').match(regex);
    return match ? match[1] : null;
  }

  // 행 썸네일 URL: 유튜브 링크(EMAIL_ADDR) 우선, 없으면 첨부 이미지(FILE_MASK) — 기존 동작 유지
  function thumbSrc(row) {
    var vid = extractVideoId(row.EMAIL_ADDR);
    if (vid) return 'https://img.youtube.com/vi/' + vid + '/sddefault.jpg';
    if (row.FILE_MASK) return THUMB_URL + '?FILE_MASK=' + encodeURIComponent(row.FILE_MASK);
    return '';
  }

  function viewUrl(row) {
    return VIEW_URL + '?ARTC_ID=' + encodeURIComponent(row.ARTC_ID) + '&boardType=promo';
  }

  // [홍보자료] 표형 그리드 컬럼 정의 (실데이터 필드 매핑)
  var columnDefs = [
    { field: "NUM", headerName: "번호", width: 100 },
    { field: "TITL", headerName: "제목", flex: 1, cellStyle: { textAlign: 'left' },
      cellRenderer: function (p) {
        // 제목 → 공용 상세(generalView, boardType=promo) 이동. text 삽입으로 XSS 안전
        return $('<a>', { href: viewUrl(p.data), text: p.value == null ? '' : String(p.value) })[0];
      },
      suppressKeyboardEvent: function (params) {
        var key = params.event.key;
        return key === 'Tab' || key === 'Enter' || key === ' ';
      }
    },
    { field: "NM", headerName: "작성자", width: 150 },
    { field: "INS_DT", headerName: "등록일", width: 140 },
    { field: "FILE_SIZE_TOTAL", headerName: "용량", width: 100,
      valueFormatter: function (p) { return formatBytes(p.value); } },
    { field: "FILE_ID", headerName: "다운로드", sortable: false, width: 100,
      cellRenderer: function (p) {
        if (!p.value) return '';
        // 행별 FILE_ID 로 다운로드 모달 오픈 (boardDownloadModal.jspf 의 openBoardDownloadModal 위임 핸들러)
        return '<button type="button" class="button button--small button--icon button--secondary js-board-download" data-fileid="' + p.value + '" title="다운로드"><i class="svg-icon download"></i><span class="button__label ir-pm">다운로드</span></button>';
      },
      suppressKeyboardEvent: function (params) {
        var key = params.event.key;
        return key === 'Tab' || key === 'Enter' || key === ' ';
      }
    }
  ];

  var gridOptions = boardGridOptions({
    columnDefs: columnDefs,
  });

  // 표형 그리드 지연 생성 + 최신 데이터 반영
  function ensureGrid() {
    if (!gridApi) {
      gridApi = agGrid.createGrid(document.querySelector('#myGrid'), gridOptions);
    }
    gridApi.setGridOption('rowData', lastList);
  }

  // 카드형 렌더 (text 삽입으로 XSS 안전)
  function fnDrawCards(list) {
    var $ul = $('.column-list').empty();
    if (!list.length) {
      $ul.append($('<li>', { 'class': 'column-list__item', text: '조회된 내용이 없습니다.' }));
      return;
    }
    $.each(list, function (i, row) {
      var title = row.TITL == null ? '' : String(row.TITL);
      var $thumb = $('<div>', { 'class': 'column-list__thumb' });
      var src = thumbSrc(row);
      if (src) {
        $thumb.append($('<img>', { src: src, alt: title, 'class': 'column-list__img' }));
      }
      var $info = $('<div>', { 'class': 'data-info' }).append(
        $('<dl>', { 'class': 'data-info__list' })
          .append($('<dt>', { 'class': 'data-info__title' }).append($('<span>', { 'class': 'blind', text: '등록일' })))
          .append($('<dd>', { 'class': 'data-info__text', text: row.INS_DT == null ? '' : String(row.INS_DT) }))
          .append($('<dt>', { 'class': 'data-info__title', text: '조회수' }))
          .append($('<dd>', { 'class': 'data-info__text', text: row.HIT == null ? '0' : String(row.HIT) }))
      );
      $ul.append($('<li>', { 'class': 'column-list__item' }).append(
        $('<a>', { href: viewUrl(row), 'class': 'column-list__link' })
          .append($thumb)
          .append($('<strong>', { 'class': 'column-list__title', text: title }))
          .append($info)
      ));
    });
  }

  // 목록 조회 (기존 selectBBSList.ajax 서버사이드 페이징/검색 그대로 사용)
  function fnGetList(pageNo) {
    curPage = pageNo || 1;
    $.ajax({
      type: 'post',
      url: '/infoGarden/selectBBSList.ajax',
      dataType: 'json',
      data: {
        BLBD_ID: 'promo',
        spageNo: curPage,
        srecordCountPerPage: PER_PAGE,
        spageSize: 10,
        searchType: 'conAndtit',
        searchValue: $.trim($('#searchBoardItem03').val() || ''),
        searchYear: $('#searchBoardItem02').val() || ''
      },
      success: function (obj) {
        lastList = (obj && obj.list) ? obj.list : [];
        fnDrawCards(lastList);
        if (gridApi) gridApi.setGridOption('rowData', lastList);
        var page = (obj && obj.page) ? obj.page : {};
        var total = Number(page._listCount) || 0;
        $('.total-number__total').text(total);
        fnRenderPaging(total, Number(page._pageNo) || curPage, Number(page._recordCountPerPage) || PER_PAGE);
      }
    });
  }

  // 페이지네이션 렌더 (기존 마크업 재사용, 버튼순서 [첫,이전,다음,마지막])
  function fnRenderPaging(listCount, current, perPage) {
    var totalPages = Math.max(1, Math.ceil(listCount / perPage));
    if (current > totalPages) current = totalPages;

    var $pc = $('.board-wrapper .pagination.pc-only');
    var $list = $pc.find('.pagination__list');
    var block = Math.floor((current - 1) / 10);
    var start = block * 10 + 1;
    var end = Math.min(start + 9, totalPages);

    var html = '';
    for (var p = start; p <= end; p++) {
      html += '<a href="#none" class="pagination__link' + (p === current ? ' pagination__link--selected' : '') + '" data-page="' + p + '">' + p + '</a>';
    }
    $list.html(html);

    var $btns = $pc.find('.pagination__button');
    $btns.eq(0).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(1); });
    $btns.eq(1).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(current - 1); });
    $btns.eq(2).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(current + 1); });
    $btns.eq(3).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(totalPages); });
    $list.find('.pagination__link').off('click.pg').on('click.pg', function (e) {
      e.preventDefault(); fnGetList(Number($(this).data('page')));
    });

    var $frac = $('.board-wrapper .pagination--fraction');
    $frac.find('.pagination__current').text(current);
    $frac.find('.pagination__total').text(totalPages);
    $frac.find('.pagination__button').eq(0).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(current - 1); });
    $frac.find('.pagination__button').eq(1).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(current + 1); });
  }

  // 연도 옵션(2015~현재, 내림차순)
  function initYears() {
    var $y = $('#searchBoardItem02');
    var now = new Date().getFullYear();
    var html = '<option value="">전체</option>';
    for (var y = now; y >= 2015; y--) html += '<option value="' + y + '">' + y + '</option>';
    $y.html(html);
  }

  // 표형/카드형 토글 (숨김: is-hidden 클래스 + aria-hidden)
  function bindListType() {
    $('#listTypeRow').on('change', function () {
      if (!this.checked) return;
      $('.board-list .column-list').addClass('is-hidden').attr('aria-hidden', 'true');
      $('#myGrid').removeClass('is-hidden').attr('aria-hidden', 'false');
      ensureGrid();
    });
    $('#listTypeColumn').on('change', function () {
      if (!this.checked) return;
      $('#myGrid').addClass('is-hidden').attr('aria-hidden', 'true');
      $('.board-list .column-list').removeClass('is-hidden').attr('aria-hidden', 'false');
    });
  }

  // 검색/초기화 바인딩
  function bindSearch() {
    $('.board-search .button--search').on('click', function () { fnGetList(1); });
    $('.board-search .button--reset').on('click', function () {
      $('#searchBoardItem02').val('');
      $('#searchBoardItem03').val('');
      fnGetList(1);
    });
    $('#searchBoardItem03').on('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); fnGetList(1); }
    });
  }

  // 다운로드 버튼 → 첨부파일 다운로드 모달 (행별 FILE_ID)
  $(document).off('click.boardDl').on('click.boardDl', '.js-board-download', function () {
    openBoardDownloadModal({ fileId: $(this).data('fileid'), opener: this });
  });

  // 초기화
  initYears();
  bindListType();
  bindSearch();
  if (initSearch) $('#searchBoardItem03').val(initSearch);
  fnGetList(initPage);
});
</script>
