            <div class="page-header__subject">
              <h1 class="heading-subject">불편민원신고 센터</h1>

            <!-- 이용과정 : 01 약관동의 -->

                  <span class="step__icon"></span>

            </div>
            <!-- //이용과정 -->

            <!-- 본문 도움말 -->
            <div class="content-help">
              <div class="content-help__img">
                <img src="assets/images/common/img-complaint.svg" alt="신고접수" />
              </div>
              <div class="content-help__content">
                <strong class="content-help__title"> 불편민원신고센터에서는 충전기 이용 시 불편하신 점을 신고하실 수 있습니다. </strong>
                <p class="content-help__description">A/S 등 고장신고는 충전기 운영기관의 고객센터로 신고하여 주시고, 불편신고 대상 충전기가 아닌 경우 미접수 될 수 있음을 알려드립니다.</p>
              </div>
            </div>
            <!-- //본문 도움말 -->

            <div class="verification-wrapper">
              <h1 class="heading-title">
                <i class="svg-icon symbol-electricity" aria-hidden="true"></i>
                약관동의
              </h1>
              <div class="agree-container">
                <div class="checkbox">
                  <input type="checkbox" id="chkAgree" class="checkbox__input" />
                  <label for="chkAgree" class="checkbox__label">
                    <span>개인정보이용 제공 동의 <span class="text-emphasis">(필수)</span></span>
                  </label>
                </div>
              </div>
              <div class="button-group">
                <button type="button" class="button button--large button--secondary" onclick="goList();">
                  <span class="button__label">나의 신고 조회하기</span>
                </button>
                <button type="button" class="button button--large button--primary" onclick="fnNext();">
                  <span class="button__label">신고접수</span>
                </button>
              </div>
            </div>

         </div>
      </div>

<form id="frm" name="frm" method="post" action="">
  <input type="hidden" name="infoAcceptYn" id="infoAcceptYn" >
</form>

<script type="application/json" id="pageInfo"></script>

<script>
  var PAGE_INFO = (function() {
    try { return JSON.parse(document.getElementById('pageInfo').textContent) || {}; } catch (e) { return {}; }
  })();
  var isLogin = PAGE_INFO.loginYn === 'Y';

  
  function fnNext() {
    if (!$('#chkAgree').is(':checked')) {
      alert('개인정보이용 제공에 동의하여 주십시요.');
      return;
    }
    var frm = document.frm;
    frm.infoAcceptYn.value = 'Y';
    frm.method = 'post';
    if (!isLogin) {
      frm.action = '/partcptn/initInconfortReportCheckAction.do';
    } else {
      frm.action = '/partcptn/initInconfortReportFormAction.do';
    }
    frm.submit();
  }

  
  function goList() {
    location.href = '/partcptn/initMyComplaintAction.do';
  }

  // 진입 시 AI 헬프데스크 패널 자동 오픈 — openHelpdesk 를 붙이는 ui-common.js 의 ready 핸들러 뒤로 미뤄 실행한다
  $(function () {
    setTimeout(function () {
      if (typeof window.openHelpdesk === 'function') { window.openHelpdesk(); }
    }, 0);
  });
</script>
