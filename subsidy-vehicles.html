<script type="application/json" id="ddlListData">[{"MADE_COMPANY_NM": "현대자동차", "UP_CODE": "1C"}, {"MADE_COMPANY_NM": "기아", "UP_CODE": "1C"}, {"MADE_COMPANY_NM": "KG모빌리티", "UP_CODE": "1C"}, {"MADE_COMPANY_NM": "테슬라", "UP_CODE": "1C"}, {"MADE_COMPANY_NM": "현대자동차", "UP_CODE": "2T"}, {"MADE_COMPANY_NM": "기아", "UP_CODE": "2T"}, {"MADE_COMPANY_NM": "현대자동차", "UP_CODE": "3B"}, {"MADE_COMPANY_NM": "그린모빌리티", "UP_CODE": "4M"}, {"MADE_COMPANY_NM": "대동모빌리티", "UP_CODE": "4M"}, {"MADE_COMPANY_NM": "현대자동차", "UP_CODE": "5C"}, {"MADE_COMPANY_NM": "현대자동차", "UP_CODE": "7B"}, {"MADE_COMPANY_NM": "현대자동차", "UP_CODE": "8T"}, {"MADE_COMPANY_NM": "현대건설기계", "UP_CODE": "11E"}]</script>

<script>
(function($){
  'use strict';

  var IMG_URL = 'assets/cars/';   /* [프로토] 서버 첨부 대신 로컬 이미지 */
  var PAGE_SIZE = 12;
  var currentPage = 1;
  var allRows = [];
  var viewRows = [];
  var gridApi = null;

  
  var ddlList = [];
  try {
    ddlList = JSON.parse(document.getElementById('ddlListData').textContent).map(function(v) {
      return { nm: v.MADE_COMPANY_NM || '', upCode: v.UP_CODE || '' };
    });
  } catch (e) {
    if (window.console && console.error) console.error('ddlListData 파싱 실패', e);
  }

  // 전기승용 1C, 전기화물 2T, 전기승합 3B, 전기이륜차 4M, 수소승용 5C, 수소화물 8T,
  // 수소승합 7B, 수소특수차 9S, 전기굴착기 6E, 수소지게차 10E, 전기지게차 11E
  var TYPE_LABELS = {
    '1C': '전기승용', '2T': '전기화물', '3B': '전기승합', '4M': '전기이륜차',
    '5C': '수소승용', '8T': '수소화물', '7B': '수소승합', '9S': '수소특수차',
    '6E': '전기굴착기', '10E': '수소지게차', '11E': '전기지게차'
  };

  function subsidyLabel(kind) {
    if (kind === '4M') return '보조금';
    if (kind === '6E' || kind === '10E' || kind === '11E') return '구매보조금';
    return '국비지원금';
  }

  // 차종 유형별 카드 상세 항목 (값 없는 항목은 생략)
  function specPairs(r) {
    var k = r.CAR_KIND;
    var pairs = [];
    function add(label, val) { if (val) pairs.push([label, String(val)]); }
    if (k === '5C' || k === '7B' || k === '8T' || k === '9S') {
      add('승차인원', r.PERSONS);
      add('최고속도·출력', r.MAX_SPEED);
      add('판매사 연락처', r.CAR_PROD_TEL);
    } else if (k === '6E') {
      add('총중량', r.WEIGHT);
      add('버켓용량(산적)', r.BUCKET_CAPACITY);
      add('최고/선회 속도', r.MAX_SPEED);
      add('최대굴삭력(버켓/암)', r.MAX_EXCAVATION);
      add('배터리', r.BATTERY);
      add('판매사 연락처', r.CAR_PROD_TEL);
    } else if (k === '10E') {
      add('적재하중', r.LDADNG_LD);
      add('정격출력', r.RATING_OUTPT);
      add('수소저장탱크 용량', r.STGK_CPCTY);
      add('충전압력', r.ELCTC_PRESSR);
      add('판매사 연락처', r.CAR_PROD_TEL);
    } else if (k === '11E') {
      add('총중량', r.WEIGHT);
      add('모터출력(kW)', r.RATED_OUTPUT);
      add('판매사 연락처', r.CAR_PROD_TEL);
    } else {
      // 전기승용/화물/승합/이륜차
      add('승차인원', r.PERSONS);
      add('1회 충전', r.CHARGER_DISTANCE);
      add('배터리', r.BATTERY);
      if (k === '4M') {
        add('제조사', r.TITLE);
        add('제조국가', r.MADE_IN_NM);
      }
      add('판매사 연락처', r.CAR_PROD_TEL);
    }
    return pairs;
  }

  function priceNum(r) {
    var n = String(r.SALE_PRICE || '').replace(/[^\d]/g, '');
    return n ? parseInt(n, 10) : 0;
  }

  // ===== 카드형 렌더 =====
  function buildCard(r) {
    var $item = $('<li>', { 'class': 'column-list__item' });
    var $link = $('<div>', { 'class': 'column-list__link' });

    var $thumb = $('<div>', { 'class': 'column-list__thumb' });
    if (r.ATTCH_ID) {
      $thumb.append($('<img>', { 'class': 'column-list__img', src: IMG_URL + r.ATTCH_ID, alt: (r.MODEL || '') + ' 차량 이미지' }));
    }
    $link.append($thumb);

    var $heading = $('<div>', { 'class': 'column-list__heading' });
    $heading.append($('<div>', { 'class': 'column-list__category' })
      .append($('<span>', { 'class': 'badge badge--outline badge--primary', text: TYPE_LABELS[r.CAR_KIND] || (r.CAR_TYPE_NM || '') })));
    $heading.append($('<strong>', { 'class': 'column-list__title', text: r.MODEL || '' }));
    $heading.append($('<div>', { 'class': 'column-list__subtitle', text: r.MADE_COMPANY_NM || '' }));
    $link.append($heading);

    var $dl = $('<dl>', { 'class': 'definition-list' });
    $dl.append($('<dt>', { 'class': 'definition-list__label' })
      .append($('<span>', { 'class': 'text-emphasis', text: subsidyLabel(r.CAR_KIND) })));
    var $price = $('<b>', { 'class': 'text-emphasis data-emphasis' });
    var m = /^([\d,\.]+)\s*만원$/.exec($.trim(String(r.SALE_PRICE || '')));
    if (m) {
      $price.text(m[1] + ' ').append($('<span>', { 'class': 'unit', text: '만원' }));
    } else {
      $price.text(r.SALE_PRICE || '-');
    }
    $dl.append($('<dd>', { 'class': 'definition-list__description' }).append($price));

    specPairs(r).forEach(function(p) {
      $dl.append($('<dt>', { 'class': 'definition-list__label', text: p[0] }));
      $dl.append($('<dd>', { 'class': 'definition-list__description', text: p[1] }));
    });
    $link.append($('<div>', { 'class': 'column-list__data' }).append($dl));

    if (r.URL) {
      $link.append($('<button>', { type: 'button', 'class': 'button button--primary', title: '판매사 상세 페이지 (새창 열림)' })
        .append($('<span>', { 'class': 'button__label', text: '상세 정보' }))
        .on('click', function() { openDetail(r.URL); }));
    }
    return $item.append($link);
  }

  function renderCards(rows) {
    var $list = $('#cardList').empty();
    if (!rows.length) {
      $list.append($('<li>', { 'class': 'column-list__item', text: '조회된 차종이 없습니다.' }));
      return;
    }
    rows.forEach(function(r) { $list.append(buildCard(r)); });
  }

  function openDetail(url) {
    if (!url) { alert('링크가 없습니다.'); return; }
    window.open(url, 'vehicleDetail', 'toolbar=0, location=no, directories=0, scrollbars=yes, status=no, menubar=0, resizable=yes, width=950, height=700, left=0, top=0');
  }

  // ===== 표형(ag-grid) =====
  function toGridRow(r) {
    return {
      type: TYPE_LABELS[r.CAR_KIND] || (r.CAR_TYPE_NM || '-'),
      maker: r.MADE_COMPANY_NM || '-',
      model: r.MODEL || '-',
      price: r.SALE_PRICE || '-',
      persons: r.PERSONS || '-',
      distance: r.CHARGER_DISTANCE || '-',
      battery: r.BATTERY || '-',
      tel: r.CAR_PROD_TEL || '-'
    };
  }

  function initGrid() {
    gridApi = agGrid.createGrid(document.getElementById('vehicleGrid'), {
      columnDefs: [
        { field: 'type', headerName: '차종' },
        { field: 'maker', headerName: '제조사' },
        { field: 'model', headerName: '모델', minWidth: 180, cellClass: 'text-left' },
        { field: 'price', headerName: '보조금', cellClass: 'text-emphasis' },
        { field: 'persons', headerName: '승차인원' },
        { field: 'distance', headerName: '1회 충전' },
        { field: 'battery', headerName: '배터리' },
        { field: 'tel', headerName: '판매사 연락처' }
      ],
      rowData: [],
      domLayout: 'autoHeight',
      defaultColDef: { flex: 1, minWidth: 100, resizable: false, sortable: false },
      overlayNoRowsTemplate: '<span>자료가 없습니다.</span>'
    });
  }

  // ===== 필터/정렬 + 페이징 =====
  function applyFilters() {
    var t = $('#schCarType').val();
    var comp = $('#schCompany').val();
    var kw = $.trim($('#schKeyword').val());
    viewRows = allRows.filter(function(r) {
      if (t && r.CAR_KIND !== t) return false;
      if (comp && (r.MADE_COMPANY_NM || '') !== comp) return false;
      if (kw && String(r.MADE_COMPANY_NM || '').indexOf(kw) < 0 && String(r.MODEL || '').indexOf(kw) < 0) return false;
      return true;
    });
    if ($('#sortSelect').val() === 'priceDesc') {
      viewRows = viewRows.slice().sort(function(a, b) { return priceNum(b) - priceNum(a); });
    }
  }

  function renderPage() {
    var pageCount = Math.max(1, Math.ceil(viewRows.length / PAGE_SIZE));
    if (currentPage > pageCount) currentPage = pageCount;
    if (currentPage < 1) currentPage = 1;

    $('#totalCount').text(viewRows.length);
    var slice = viewRows.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
    renderCards(slice);
    if (gridApi) gridApi.setGridOption('rowData', slice.map(toGridRow));
    renderPagination(pageCount);
  }

  function renderPagination(pageCount) {
    var $list = $('#pageList').empty();
    var start = Math.max(1, Math.min(currentPage - 2, pageCount - 4));
    var end = Math.min(pageCount, start + 4);
    for (var n = start; n <= end; n++) {
      $list.append($('<a>', {
        href: '#none',
        'class': 'pagination__link' + (n === currentPage ? ' pagination__link--selected' : ''),
        text: n,
        'data-num': n
      }));
    }
    $('#pageCurrent').text(currentPage);
    $('#pageTotal').text(pageCount);
    $('#pcPagination, #fractionPagination').data('pageCount', pageCount);
  }

  function goPage(next) {
    var pageCount = $('#pcPagination').data('pageCount') || 1;
    var n = next;
    if (next === 'first') n = 1;
    else if (next === 'prev') n = currentPage - 1;
    else if (next === 'next') n = currentPage + 1;
    else if (next === 'last') n = pageCount;
    n = Math.min(Math.max(1, n), pageCount);
    if (n === currentPage) return;
    currentPage = n;
    renderPage();
  }

  function refresh(page) {
    applyFilters();
    currentPage = page || 1;
    renderPage();
  }

  // 차종 유형에 맞는 제조사 옵션 구성 (전체 시 이름 기준 중복 제거)
  function syncCompanyOptions() {
    var t = $('#schCarType').val();
    var $sel = $('#schCompany').empty().append($('<option>', { value: '', text: '전체' }));
    var seen = {};
    ddlList.forEach(function(d) {
      if (t && d.upCode !== t) return;
      if (!d.nm || seen[d.nm]) return;
      seen[d.nm] = true;
      $sel.append($('<option>', { value: d.nm, text: d.nm }));
    });
  }

  // ===== 목록 보기 타입 스위치 =====
  function toggleBoardList() {
    var showGrid = $('#listTypeRow').prop('checked');
    $('#vehicleGrid').toggleClass('is-hidden', !showGrid).attr('aria-hidden', String(!showGrid));
    $('#cardList').toggleClass('is-hidden', showGrid).attr('aria-hidden', String(showGrid));
    if (showGrid && gridApi) {
      requestAnimationFrame(function() { gridApi.onGridSizeChanged(); });
    }
  }

  // ===== 데이터 조회 (전체 조회 후 클라이언트 필터/페이징) =====
  function loadVehicles() {
    $.ajax({
      type: 'POST',
      url: '/buySupprt/selectTargetVehicle.ajax',
      dataType: 'json',
      data: { spageId: 'subsidyTargetVehicle', spageNo: '1', srecordCountPerPage: '99999', spageSize: '10', carType: '', schCompany: 'ALL', schModel: 'ALL' },
      success: function(data) {
        allRows = (data && data.list) || [];
        refresh(1);
      },
      error: function() {
        allRows = [];
        refresh(1);
      }
    });
  }

  $(function() {
    initGrid();
    syncCompanyOptions();

    $('#schCarType').on('change', function() {
      syncCompanyOptions();
      refresh(1);
    });
    $('#schCompany, #sortSelect').on('change', function() { refresh(1); });
    $('#schKeyword').on('keydown', function(e) {
      if (e.which === 13) refresh(1);
    });
    $('#btnSearch').on('click', function() { refresh(1); });
    $('#btnReset').on('click', function() {
      $('#schCarType').val('');
      syncCompanyOptions();
      $('#schKeyword').val('');
      $('#sortSelect').val('');
      refresh(1);
    });

    $('#listTypeRow, #listTypeColumn').on('change', toggleBoardList);

    $('#pcPagination, #fractionPagination').on('click', '.pagination__button', function() {
      goPage($(this).data('page'));
    });
    $('#pageList').on('click', '.pagination__link', function(e) {
      e.preventDefault();
      goPage(Number($(this).data('num')));
    });

    loadVehicles();
  });
})(jQuery);
