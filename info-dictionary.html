<script>
$(function () {
  var curPage = 1;
  var PER_PAGE = 10;

  // 목록 조회 (기존 selectDictionaryList.ajax 서버사이드 페이징/검색 그대로 사용)
  function fnGetList(pageNo) {
    curPage = pageNo || 1;
    $.ajax({
      type: 'post',
      url: '/infoGarden/selectDictionaryList.ajax',
      dataType: 'json',
      data: {
        spageNo: curPage,
        srecordCountPerPage: PER_PAGE,
        spageSize: 10,
        kor_gubun: '',
        eng_gubun: '',
        searchType: $('#searchBoardItem01').val() || 'conAndtit',
        searchValue: $.trim($('#searchBoardItem03').val() || '')
      },
      success: function (obj) {
        var list = (obj && obj.list) ? obj.list : [];
        fnDrawList(list);
        var page = (obj && obj.page) ? obj.page : {};
        var total = Number(page._listCount) || 0;
        fnRenderPaging(total, Number(page._pageNo) || curPage, Number(page._recordCountPerPage) || PER_PAGE);
      }
    });
  }

  // 용어 목록 렌더 (text 삽입으로 XSS 안전)
  function fnDrawList(list) {
    var $ul = $('.glossary-list').empty();
    if (!list.length) {
      $ul.append($('<li>', { 'class': 'glossary-list__item' })
        .append($('<p>', { 'class': 'glossary-list__description', text: '조회된 내용이 없습니다.' })));
      return;
    }
    $.each(list, function (i, row) {
      var $title = $('<div>', { 'class': 'glossary-list__title' })
        .append($('<strong>', { 'class': 'glossary-list__title-abbr', text: row.KOR_DIC == null ? '' : String(row.KOR_DIC) }))
        .append($('<span>', { 'class': 'glossary-list__title-whole', text: row.ENG_DIC == null ? '' : String(row.ENG_DIC) }));
      $ul.append($('<li>', { 'class': 'glossary-list__item' })
        .append($title)
        .append($('<p>', { 'class': 'glossary-list__description', text: row.DESCRIPTION == null ? '' : String(row.DESCRIPTION) })));
    });
  }

  // 페이지네이션 렌더 (기존 마크업 재사용, 버튼순서 [첫,이전,다음,마지막])
  function fnRenderPaging(listCount, current, perPage) {
    var totalPages = Math.max(1, Math.ceil(listCount / perPage));
    if (current > totalPages) current = totalPages;

    var $pc = $('.board-wrapper .pagination.pc-only');
    var $list = $pc.find('.pagination__list');
    var block = Math.floor((current - 1) / 10);
    var start = block * 10 + 1;
    var end = Math.min(start + 9, totalPages);

    var html = '';
    for (var p = start; p <= end; p++) {
      html += '<a href="#none" class="pagination__link' + (p === current ? ' pagination__link--selected' : '') + '" data-page="' + p + '">' + p + '</a>';
    }
    $list.html(html);

    var $btns = $pc.find('.pagination__button');
    $btns.eq(0).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(1); });
    $btns.eq(1).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(current - 1); });
    $btns.eq(2).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(current + 1); });
    $btns.eq(3).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(totalPages); });
    $list.find('.pagination__link').off('click.pg').on('click.pg', function (e) {
      e.preventDefault(); fnGetList(Number($(this).data('page')));
    });

    var $frac = $('.board-wrapper .pagination--fraction');
    $frac.find('.pagination__current').text(current);
    $frac.find('.pagination__total').text(totalPages);
    $frac.find('.pagination__button').eq(0).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(current - 1); });
    $frac.find('.pagination__button').eq(1).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(current + 1); });
  }

  // 검색 바인딩
  $('.board-search .button--search').on('click', function () { fnGetList(1); });
  $('#searchBoardItem03').on('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); fnGetList(1); }
  });

  fnGetList(1);
});
</script>
