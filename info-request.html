<form id="frm" name="frm" method="post" style="display:none;">

  <input type="hidden" id="MODE" name="MODE" value=""/>

<script src="assets/js/board-grid.js?v=20260827a"></script>
<script>
$(function () {
  var gridApi;
  var curPage = 1;
  var PER_PAGE = 10;
  var DTL_URL = '/partcptn/selectRequestedItemDtl.do';

  // [요청자료(지자체)] 그리드 컬럼 정의 (EVCS_REQUEST_DATA 실데이터 필드 매핑 — 로그인 회원 본인 요청건만 조회됨)
  var columnDefs = [
    { field: "NUM", headerName: "번호", width: 100 },
    { field: "REQ_STATUS_NM", headerName: "처리상태", width: 120 },
    { field: "REQ_CATE_NM", headerName: "구분", width: 120 },
    { field: "TITLE", headerName: "제목", flex: 1, cellClass: "ag-cell-link", cellStyle: { textAlign: 'left' },
      cellRenderer: function (p) {
        var title = p.value == null ? '' : String(p.value);
        return $('<a>', { href: DTL_URL + '?REQ_NUM=' + encodeURIComponent(p.data.REQ_NUM), 'class': 'link', text: title })[0];
      },
      suppressKeyboardEvent: function (params) {
        var key = params.event.key;
        return key === 'Tab' || key === 'Enter' || key === ' ';
      }
    },
    { field: "REG_DT", headerName: "등록일", width: 140 },
    { field: "RES_FILE_MASK", headerName: "회신자료", sortable: false, width: 110,
      cellRenderer: function (p) {
        if (!p.value) return '';
        // 회신파일은 FILE_ID 그룹이 아닌 단일 FILE_MASK 저장 — 모달에 files 배열로 직접 전달
        var $btn = $('<button>', { type: 'button', 'class': 'button button--small button--icon button--secondary js-reply-download', title: '회신자료 다운로드' })
          .attr('data-filemask', p.value)
          .attr('data-filename', p.data.RES_FILE_NM == null ? '' : String(p.data.RES_FILE_NM));
        $btn.append($('<i>', { 'class': 'svg-icon download' }));
        $btn.append($('<span>', { 'class': 'button__label ir-pm', text: '다운로드' }));
        return $btn[0];
      },
      suppressKeyboardEvent: function (params) {
        var key = params.event.key;
        return key === 'Tab' || key === 'Enter' || key === ' ';
      }
    }
  ];

  var gridOptions = boardGridOptions({
    columnDefs: columnDefs,
  });

  // 목록 조회 (서버사이드 페이징 + 구분(카테고리)·검색어 검색)
  function fnGetList(pageNo) {
    curPage = pageNo || 1;
    $.ajax({
      type: 'post',
      url: '/infoGarden/selectRequestedItemList.ajax',
      dataType: 'json',
      data: {
        spageNo: curPage,
        srecordCountPerPage: PER_PAGE,
        spageSize: 10,
        REQ_CATE: $('#searchBoardItem01').val() || '',
        searchType: 'conAndtit',
        searchValue: $.trim($('#searchBoardItem03').val() || '')
      },
      success: function (obj) {
        var list = (obj && obj.list) ? obj.list : [];
        gridApi.setGridOption('rowData', list);
        var page = (obj && obj.page) ? obj.page : {};
        var total = Number(page._listCount) || 0;
        $('.total-number__total').text(total);
        fnRenderPaging(total, Number(page._pageNo) || curPage, Number(page._recordCountPerPage) || PER_PAGE);
      }
    });
  }

  // 페이지네이션 렌더 (기존 마크업 재사용, 버튼순서 [첫,이전,다음,마지막])
  function fnRenderPaging(listCount, current, perPage) {
    var totalPages = Math.max(1, Math.ceil(listCount / perPage));
    if (current > totalPages) current = totalPages;

    var $pc = $('.board-wrapper .pagination.pc-only');
    var $list = $pc.find('.pagination__list');
    var block = Math.floor((current - 1) / 10);
    var start = block * 10 + 1;
    var end = Math.min(start + 9, totalPages);

    var html = '';
    for (var p = start; p <= end; p++) {
      html += '<a href="#none" class="pagination__link' + (p === current ? ' pagination__link--selected' : '') + '" data-page="' + p + '">' + p + '</a>';
    }
    $list.html(html);

    var $btns = $pc.find('.pagination__button');
    $btns.eq(0).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(1); });
    $btns.eq(1).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(current - 1); });
    $btns.eq(2).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(current + 1); });
    $btns.eq(3).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(totalPages); });
    $list.find('.pagination__link').off('click.pg').on('click.pg', function (e) {
      e.preventDefault(); fnGetList(Number($(this).data('page')));
    });

    var $frac = $('.board-wrapper .pagination--fraction');
    $frac.find('.pagination__current').text(current);
    $frac.find('.pagination__total').text(totalPages);
  }

  // 검색/초기화 바인딩
  function bindSearch() {
    $('.board-search .button--search').on('click', function () { fnGetList(1); });
    $('.board-search .button--reset').on('click', function () {
      $('#searchBoardItem01').val('');
      $('#searchBoardItem03').val('');
      fnGetList(1);
    });
    $('#searchBoardItem03').on('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); fnGetList(1); }
    });
  }

  // 회신자료 다운로드 → 첨부파일 다운로드 모달 (단일 파일, FILE_SIZE 미보유 → '-' 표시)
  $(document).off('click.replyDl').on('click.replyDl', '.js-reply-download', function () {
    openBoardDownloadModal({
      files: [{ FILE_MASK: $(this).attr('data-filemask'), FILE_NAME: $(this).attr('data-filename'), FILE_SIZE: '' }],
      title: '회신자료',
      opener: this
    });
  });

  // 등록 화면 이동 (권한·로그인 확인은 서버가 처리)
  $('#btnNewRequest').on('click', function () {
    var frm = document.frm;
    frm.MODE.value = 'write';
    frm.action = '/partcptn/initRequestedItemEditAction.do';
    frm.submit();
  });

  // 초기화
  var gridDiv = document.querySelector('#myGrid');
  gridApi = agGrid.createGrid(gridDiv, gridOptions);
  bindSearch();
  fnGetList(1);
});
</script>
