<script>
$(function () {
  var LIST_URL = '/buySupprt/retriveSlowChargerAction.ajax';
  var IMAGE_URL = '/file/viewImage.do';
  var PUBLIC_YN = 'R';      // 스마트제어 완속충전기
  var TYPE_CD = 'FIRE';
  var PER_PAGE = 12;

  var allList = [];         // 선택된 제조사의 전체 제품
  var viewList = [];        // 화면 필터 적용 결과
  var busiInfo = {};        // 선택된 제조사 정보(BNM/PHONE/URL)
  var curPage = 1;

  // NVL(' ') 로 내려오는 빈값 정리
  function val(v) {
    var s = (v === null || v === undefined) ? '' : String(v);
    return $.trim(s);
  }

  // 콤마 구분 결제수단 → 배열
  function paymentList(row) {
    return $.map(val(row.PAYMENT).split(','), function (v) { return $.trim(v) || null; });
  }

  // 참고/부가제품: <br> 또는 개행으로 분리하고 머리기호 제거
  function bulletList(text) {
    var raw = val(text).replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '');
    return $.map(raw.split('\n'), function (v) {
      var s = $.trim(v).replace(/^[-·•*]\s*/, '');
      return s || null;
    });
  }

  // 충전기가격: 숫자면 천단위 구분 + 원
  function priceText(v) {
    var s = val(v);
    if (!s) return '';
    var digits = s.replace(/[^0-9]/g, '');
    if (!digits || digits.length !== s.replace(/[,\s]/g, '').length) return s;
    return Number(digits).toLocaleString() + '원';
  }

  function imageSrc(row) {
    var id = val(row.ATTCH_ID);
    return id ? IMAGE_URL + '?atch_id=' + encodeURIComponent(id) : '';
  }

  function makerUrl() {
    var url = val(busiInfo.URL);
    if (!url) return '';
    return url.indexOf('http') === 0 ? url : 'http://' + url;
  }

  function badgeBox(row) {
    var $box = $('<div>', { 'class': 'badges' });
    $.each(paymentList(row), function (i, label) {
      $box.append($('<div>', { 'class': 'badge' }).append($('<span>', { 'class': 'badge__label', text: label })));
    });
    return $box;
  }

  // 정격용량 정렬용 숫자 추출
  function volumeNum(v) {
    var m = val(v).match(/[0-9]+(\.[0-9]+)?/);
    return m ? parseFloat(m[0]) : 0;
  }

  // 목록 데이터에서 필터 옵션 재구성 (선택값은 유지 가능한 경우에만)
  function fillFilterOptions() {
    var ctypes = [], volumes = [], payments = [];
    $.each(allList, function (i, row) {
      var c = val(row.CTYPE), v = val(row.VOLUME);
      if (c && $.inArray(c, ctypes) < 0) ctypes.push(c);
      if (v && $.inArray(v, volumes) < 0) volumes.push(v);
      $.each(paymentList(row), function (j, p) {
        if ($.inArray(p, payments) < 0) payments.push(p);
      });
    });
    ctypes.sort();
    payments.sort();
    volumes.sort(function (a, b) { return volumeNum(a) - volumeNum(b); });

    setOptions($('#searchCtype'), ctypes);
    setOptions($('#searchVolume'), volumes);
    setOptions($('#searchPayment'), payments);
  }

  function setOptions($sel, items) {
    var prev = $sel.val();
    $sel.empty().append($('<option>', { value: '', text: '전체' }));
    $.each(items, function (i, v) {
      $sel.append($('<option>', { value: v, text: v }));
    });
    if (prev && $.inArray(prev, items) >= 0) $sel.val(prev);
  }

  // 화면 필터 적용
  function applyFilter(pageNo) {
    var ctype = $('#searchCtype').val() || '';
    var volume = $('#searchVolume').val() || '';
    var payment = $('#searchPayment').val() || '';

    viewList = $.grep(allList, function (row) {
      if (ctype && val(row.CTYPE) !== ctype) return false;
      if (volume && val(row.VOLUME) !== volume) return false;
      if (payment && $.inArray(payment, paymentList(row)) < 0) return false;
      return true;
    });

    $('.total-number__total').text(viewList.length);
    fnDrawCards(pageNo || 1);
  }

  // 카드형 렌더 (text 삽입으로 XSS 안전)
  function fnDrawCards(pageNo) {
    var totalPages = Math.max(1, Math.ceil(viewList.length / PER_PAGE));
    curPage = Math.min(Math.max(1, pageNo || 1), totalPages);

    var $ul = $('.board-list .column-list').empty();
    if (!viewList.length) {
      $ul.append($('<li>', { 'class': 'column-list__item', text: '조회된 내용이 없습니다.' }));
      fnRenderPaging(0, 1);
      return;
    }

    var start = (curPage - 1) * PER_PAGE;
    $.each(viewList.slice(start, start + PER_PAGE), function (i, row) {
      var idx = start + i;
      var modelNm = val(row.MODEL_NM);

      var $thumb = $('<div>', { 'class': 'column-list__thumb' });
      var src = imageSrc(row);
      if (src) {
        $thumb.append($('<img>', { src: src, alt: modelNm + ' 제품 이미지', 'class': 'column-list__img' }));
      }

      var $dl = $('<dl>', { 'class': 'definition-list definition-list--auto' });
      $.each([['유형', val(row.CTYPE)], ['정격용량', val(row.VOLUME)], ['충전케이블', val(row.CABLE)]], function (j, item) {
        $dl.append($('<dt>', { 'class': 'definition-list__label', text: item[0] }))
           .append($('<dd>', { 'class': 'definition-list__description', text: item[1] || '-' }));
      });
      $dl.append($('<dt>', { 'class': 'definition-list__label', text: '결제타입' }))
         .append($('<dd>', { 'class': 'definition-list__description' }).append(badgeBox(row)));

      var $actions = $('<div>', { 'class': 'column-list__actions' }).append(
        $('<button>', { type: 'button', 'class': 'button button--primary js-detail', 'data-idx': idx })
          .append($('<span>', { 'class': 'button__label', text: '상세 보기' }))
      );
      var homeUrl = makerUrl();
      if (homeUrl) {
        $actions.append(
          $('<a>', { href: homeUrl, target: '_blank', 'class': 'button button--icon button--secondary', title: '새창열림' })
            .append($('<i>', { 'class': 'svg-icon external-link' }))
            .append($('<span>', { 'class': 'button__label', text: '홈페이지 바로가기' }))
        );
      }

      $ul.append($('<li>', { 'class': 'column-list__item' }).append(
        $('<div>', { 'class': 'column-list__link' })
          .append($thumb)
          .append($('<div>', { 'class': 'column-list__heading' })
            .append($('<strong>', { 'class': 'column-list__title', text: modelNm }))
            .append($('<div>', { 'class': 'column-list__subtitle' })
              .append($('<span>', { 'class': 'text-emphasis', text: val(busiInfo.BNM) })))
          )
          .append($('<div>', { 'class': 'column-list__data' }).append($dl))
          .append($actions)
      ));
    });

    fnRenderPaging(viewList.length, curPage);
  }

  // 페이지네이션 렌더 (버튼순서 [첫,이전,다음,마지막])
  function fnRenderPaging(listCount, current) {
    var totalPages = Math.max(1, Math.ceil(listCount / PER_PAGE));
    if (current > totalPages) current = totalPages;

    var $pc = $('.board-wrapper .pagination.pc-only');
    var $list = $pc.find('.pagination__list');
    var block = Math.floor((current - 1) / 10);
    var start = block * 10 + 1;
    var end = Math.min(start + 9, totalPages);

    var html = '';
    for (var p = start; p <= end; p++) {
      html += '<a href="#none" class="pagination__link' + (p === current ? ' pagination__link--selected' : '') + '" data-page="' + p + '">' + p + '</a>';
    }
    $list.html(html);

    var $btns = $pc.find('.pagination__button');
    $btns.eq(0).off('click.pg').on('click.pg', function () { if (current > 1) fnDrawCards(1); });
    $btns.eq(1).off('click.pg').on('click.pg', function () { if (current > 1) fnDrawCards(current - 1); });
    $btns.eq(2).off('click.pg').on('click.pg', function () { if (current < totalPages) fnDrawCards(current + 1); });
    $btns.eq(3).off('click.pg').on('click.pg', function () { if (current < totalPages) fnDrawCards(totalPages); });
    $list.find('.pagination__link').off('click.pg').on('click.pg', function (e) {
      e.preventDefault(); fnDrawCards(Number($(this).data('page')));
    });

    var $frac = $('.board-wrapper .pagination--fraction');
    $frac.find('.pagination__current').text(current);
    $frac.find('.pagination__total').text(totalPages);
    $frac.find('.pagination__button').eq(0).off('click.pg').on('click.pg', function () { if (current > 1) fnDrawCards(current - 1); });
    $frac.find('.pagination__button').eq(1).off('click.pg').on('click.pg', function () { if (current < totalPages) fnDrawCards(current + 1); });
  }

  // 상세 팝업 (제품 1건)
  function fnOpenDetail(idx, opener) {
    var row = viewList[idx];
    if (!row) return;

    var $modal = $('#modalChargerDetail');
    var makerNm = val(busiInfo.BNM);
    var phone = val(busiInfo.PHONE);

    $modal.find('.modal__header-title').text(val(row.MODEL_NM));
    $modal.find('.modal__header-description').text(phone ? makerNm + ' (대표전화 ' + phone + ')' : makerNm);

    var $thumb = $modal.find('.charger-summary__thumb').empty();
    var src = imageSrc(row);
    if (src) {
      $thumb.append($('<img>', { src: src, alt: val(row.MODEL_NM) + ' 제품 이미지', 'class': 'charger-summary__img' }));
    }

    // 충전요금: 평균/최저/최고
    var $fee = $modal.find('.data-set-group').empty();
    $.each([['평균', val(row.CFEE1), true], ['최저', val(row.CFEE2), false], ['최고', val(row.CFEE3), false]], function (i, item) {
      if (!item[1]) return;
      var $label = $('<dt>', { 'class': 'data-set__label' });
      var $figure = $('<dd>', { 'class': 'data-set__figure' });
      if (item[2]) {
        $label.append($('<b>', { 'class': 'text-emphasis', text: item[0] }));
        $figure.append($('<b>', { 'class': 'text-emphasis', text: item[1] }));
      } else {
        $label.text(item[0]);
        $figure.text(item[1]);
      }
      $fee.append($('<dl>', { 'class': 'data-set' }).append($label).append($figure));
    });
    if (!$fee.children().length) {
      $fee.append($('<dl>', { 'class': 'data-set' })
        .append($('<dt>', { 'class': 'data-set__label', text: '요금' }))
        .append($('<dd>', { 'class': 'data-set__figure', text: '-' })));
    }

    // 그 외 요금 안내(CFEE4/CFEE5)는 문구 그대로 표기
    var etc = $.grep([val(row.CFEE4), val(row.CFEE5)], function (v) { return !!v; });
    $modal.find('.js-fee-etc').text(etc.join(' / ')).toggle(etc.length > 0);

    var $badges = $modal.find('.charger-summary__info > .badges').empty();
    $.each(paymentList(row), function (i, label) {
      $badges.append($('<div>', { 'class': 'badge' }).append($('<span>', { 'class': 'badge__label', text: label })));
    });

    // 상세 사양 표
    var $tbody = $modal.find('.board-data tbody').empty();
    $.each([['정격용량', val(row.VOLUME)], ['유형', val(row.CTYPE)], ['충전케이블', val(row.CABLE)],
            ['제품크기', val(row.CSIZE)], ['제품재질', val(row.MATERIAL)], ['충전기 가격', priceText(row.PRICE)]], function (i, item) {
      if (!item[1]) return;
      $tbody.append($('<tr>')
        .append($('<th>', { scope: 'row', text: item[0] }))
        .append($('<td>', { text: item[1] })));
    });
    $.each([['참고', bulletList(row.NOTE)], ['부가제품', bulletList(row.ADDPRODUCT)]], function (i, item) {
      if (!item[1].length) return;
      var $ul = $('<ul>', { 'class': 'bullet bullet--dotted' });
      $.each(item[1], function (j, text) { $ul.append($('<li>', { text: text })); });
      $tbody.append($('<tr>')
        .append($('<th>', { scope: 'row', text: item[0] }))
        .append($('<td>').append($ul)));
    });

    var homeUrl = makerUrl();
    $modal.find('.js-maker-home').attr('href', homeUrl || '#none').toggle(!!homeUrl);

    openModal('#modalChargerDetail', { width: 700, opener: opener });
  }

  // 제조사 목록 → select (서버가 지정한 기본 제조사 선택)
  function fillMakers(blist, curBid) {
    var $sel = $('#searchMaker').empty();
    if (!blist || !blist.length) {
      $sel.append($('<option>', { value: '', text: '등록된 제조사가 없습니다.' })).prop('disabled', true);
      return;
    }
    $sel.prop('disabled', false);
    $.each(blist, function (i, b) {
      $sel.append($('<option>', { value: val(b.BID), text: val(b.BNM) }));
    });
    if (curBid) $sel.val(curBid);
  }

  // 제품 조회 (기존 retriveSlowChargerAction.ajax 그대로 사용, bid 미지정 시 서버가 기본 제조사 선택)
  function fnSearch(bid) {
    $.ajax({
      type: 'post',
      url: LIST_URL,
      dataType: 'json',
      data: { bid: bid || '', publicyn: PUBLIC_YN, type_cd: TYPE_CD },
      success: function (result) {
        busiInfo = (result && result.busiInfo) ? result.busiInfo : {};
        allList = (result && result.imgList) ? result.imgList : [];
        fillMakers(result ? result.blist : null, val(busiInfo.BID));
        fillFilterOptions();
        applyFilter(1);
      }
    });
  }

  // 검색폼: 제조사 변경은 서버 재조회, 나머지는 화면 필터
  $('#searchMaker').on('change', function () { fnSearch($(this).val()); });
  $('.board-search .button--search').on('click', function () { applyFilter(1); });
  $('.board-search .button--reset').on('click', function () {
    $('#searchCtype, #searchVolume, #searchPayment').val('');
    applyFilter(1);
  });

  // 카드 상세 보기
  $(document).on('click', '.column-list .js-detail', function () {
    fnOpenDetail(Number($(this).data('idx')), this);
  });
  fnSearch('');
});
</script>
