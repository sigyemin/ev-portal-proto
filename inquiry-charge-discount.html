<form id="frm" name="frm" method="post" action="">
  <input type="hidden" name="infoAcceptYn" id="infoAcceptYn" >
</form>

<script type="application/json" id="pageInfo"></script>

<script>
  var PAGE_INFO = (function() {
    try { return JSON.parse(document.getElementById('pageInfo').textContent) || {}; } catch (e) { return {}; }
  })();
  var isLogin = PAGE_INFO.loginYn === 'Y';

  
  function fnNext() {
    if (!$('#chkAgree').is(':checked')) {
      alert('개인정보이용 제공에 동의하여 주십시요.');
      return;
    }
    var frm = document.frm;
    frm.infoAcceptYn.value = 'Y';
    frm.method = 'post';
    if (isLogin) {
      frm.action = '/partcptn/initChargeCrgDscntUnaplcnReportFormAction.do';
    } else {
      frm.action = '/partcptn/initChargeCrgDscntUnaplcnReportCheckAction.do';
    }
    frm.submit();
  }

  
  function goList() {
    location.href = '/partcptn/initMyComplaintAction.do';
  }
</script>
