<form id="frm" name="frm" method="post" style="display:none;">

  <input type="hidden" id="ARTC_ID" name="ARTC_ID" value=""/>

<script type="application/json" id="pageInfo"></script>

<script src="assets/js/board-grid.js?v=20260827a"></script>
<script>
$(function () {
  var gridApi;
  var curPage = 1;
  var PER_PAGE = 10;
  // 검색조건·로그인 상수: 컨트롤러 pageInfo 직렬화에서 획득
  var PAGE_INFO = (function() {
    try { return JSON.parse(document.getElementById('pageInfo').textContent) || {}; } catch (e) { return {}; }
  })();
  var isLogin = PAGE_INFO.loginYn === 'Y';
  var myArtcYn = 'N'; // 내 질문 탭 여부

  
  var initPage = Number(PAGE_INFO.curPage) || 1;
  var initSearch = PAGE_INFO.searchValue || '';
  var initCtgry = PAGE_INFO.ctgryCd || '';
  var initQnagbn = PAGE_INFO.qnagbn || '';
  var initReplyState = PAGE_INFO.replyState || '';

  // 상세(selectQnaDtl.do) 이동 URL — 목록 복귀 파라미터 포함
  function fnDtlUrl(artcId) {
    return '/partcptn/selectQnaDtl.do'
      + '?BLBD_ID=qna&ARTC_ID=' + encodeURIComponent(artcId)
      + '&spageNo=' + curPage
      + '&searchType=conAndtit'
      + '&searchValue=' + encodeURIComponent($.trim($('#searchBoardItem03').val() || ''))
      + '&CTGRY_CD=' + encodeURIComponent($('#searchBoardItem00').val() || '')
      + '&QNAGBN=' + encodeURIComponent($('#searchBoardItem01').val() || '')
      + '&S_REPLY_STATE=' + encodeURIComponent($('#searchBoardItem02').val() || '');
  }

  // [질의응답] 그리드 컬럼 정의 (실데이터 필드 매핑)
  var columnDefs = [
    { field: "NUM", headerName: "번호", width: 80 },
    // 카테고리: 대분류 > 소분류 결합 표시 (한쪽만 있으면 그 값만)
    { colId: "CTGRY_NM", headerName: "카테고리", flex: 1,
      valueGetter: function (p) {
        var ctgry = p.data.CTGRY_NM || '';
        var sub = p.data.QNAGBN_NM || '';
        return ctgry && sub ? ctgry + ' > ' + sub : (ctgry || sub);
      }
    },
    { field: "TITL", headerName: "제목", flex: 3, cellClass: "ag-cell-link", cellStyle: { textAlign: 'left' },
      cellRenderer: function (p) {
        var titl = p.value == null ? '' : String(p.value);
        // 비공개(비밀글) 글은 본인(OWNER_YN=Y)만 상세 열람 가능 — 그 외에는 링크 미제공 (서버에서도 재검증)
        if (p.data.OPEN_YN === 'N' && p.data.OWNER_YN !== 'Y') {
          return $('<span>', { text: titl })[0];
        }
        return $('<a>', { href: fnDtlUrl(p.data.ARTC_ID), 'class': 'link', text: titl })[0];
      },
      suppressKeyboardEvent: function (params) {
        var key = params.event.key;
        return key === 'Tab' || key === 'Enter' || key === ' ';
      }
    },
    { field: "NM", headerName: "작성자", flex: 1 },
    { field: "INS_DT", headerName: "등록일", width: 120 },
    { field: "HIT", headerName: "조회수", width: 100 },
    { field: "REPLY_STATE_NM", headerName: "상태", width: 100, cellClass: "ag-cell-status",
      cellClassRules: {
        'ag-cell-status--ready': function (params) { return params.value === '접수전'; },
        'ag-cell-status--complete': function (params) { return params.value != null && params.value !== '접수전'; }
      }
    }
  ];

  var gridOptions = boardGridOptions({
    columnDefs: columnDefs,
    // 공개/비공개 구분 : OPEN_YN=N 행에 '비공개' 배지 (style.css .ag-row-lock)
    rowClassRules: {
      'ag-row-lock': function (params) { return params.data.OPEN_YN === 'N'; }
    },
    // 반응형 옵션 변경 (퍼블리싱 규칙 유지)
    onGridSizeChanged: function (params) {
      var isResponse = window.innerWidth < 1024;
      var isMobile = window.innerWidth < 640;
      var currentDefaultColDef = params.api.getGridOption('defaultColDef') || {};

      // 컬럼 숨김
      params.api.setColumnsVisible(['CTGRY_NM'], !isResponse);
      params.api.setColumnsVisible(['HIT'], !isResponse);
      params.api.setColumnsVisible(['NUM'], !isMobile);
      params.api.setColumnsVisible(['NM'], !isMobile);
      params.api.sizeColumnsToFit();

      // 말줄임 제거 후 높이 자동조정
      params.api.updateGridOptions({
        defaultColDef: $.extend({}, currentDefaultColDef, { wrapText: isResponse, autoHeight: isResponse })
      });

      params.api.resetRowHeights();
    }
  });

  // 목록 조회 (기존 selectBBSList.ajax 서버사이드 페이징/검색 그대로 사용)
  function fnGetList(pageNo) {
    curPage = pageNo || 1;
    $.ajax({
      type: 'post',
      url: '/infoGarden/selectBBSList.ajax',
      dataType: 'json',
      data: {
        BLBD_ID: 'qna',
        spageNo: curPage,
        srecordCountPerPage: PER_PAGE,
        spageSize: 10,
        searchType: 'conAndtit',
        searchValue: $.trim($('#searchBoardItem03').val() || ''),
        CTGRY_CD: $('#searchBoardItem00').val() || '',
        QNAGBN: $('#searchBoardItem01').val() || '',
        S_REPLY_STATE: $('#searchBoardItem02').val() || '',
        MY_ARTC_YN: myArtcYn
      },
      success: function (obj) {
        var list = (obj && obj.list) ? obj.list : [];
        gridApi.setGridOption('rowData', list);
        var page = (obj && obj.page) ? obj.page : {};
        var total = Number(page._listCount) || 0;
        $('.total-number__total').text(total);
        $('.total-number__shown').text(list.length);
        fnRenderPaging(total, Number(page._pageNo) || curPage, Number(page._recordCountPerPage) || PER_PAGE);
      }
    });
  }

  // 페이지네이션 렌더 (기존 마크업 재사용, 버튼순서 [첫,이전,다음,마지막])
  function fnRenderPaging(listCount, current, perPage) {
    var totalPages = Math.max(1, Math.ceil(listCount / perPage));
    if (current > totalPages) current = totalPages;

    var $pc = $('.board-wrapper .pagination.pc-only');
    var $list = $pc.find('.pagination__list');
    var block = Math.floor((current - 1) / 10);
    var start = block * 10 + 1;
    var end = Math.min(start + 9, totalPages);

    var html = '';
    for (var p = start; p <= end; p++) {
      html += '<a href="#none" class="pagination__link' + (p === current ? ' pagination__link--selected' : '') + '" data-page="' + p + '">' + p + '</a>';
    }
    $list.html(html);

    var $btns = $pc.find('.pagination__button');
    $btns.eq(0).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(1); });
    $btns.eq(1).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(current - 1); });
    $btns.eq(2).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(current + 1); });
    $btns.eq(3).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(totalPages); });
    $list.find('.pagination__link').off('click.pg').on('click.pg', function (e) {
      e.preventDefault(); fnGetList(Number($(this).data('page')));
    });

    var $frac = $('.board-wrapper .pagination--fraction');
    $frac.find('.pagination__current').text(current);
    $frac.find('.pagination__total').text(totalPages);
    $frac.find('.pagination__button').eq(0).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(current - 1); });
    $frac.find('.pagination__button').eq(1).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(current + 1); });
  }

  // 탭(전체 목록/내 질문) 전환 — 내 질문은 로그인 필요
  function fnChangeTab(tab) {
    if (tab === 'my' && !isLogin) {
      alert('로그인 후 이용할 수 있습니다.');
      return false;
    }
    myArtcYn = (tab === 'my') ? 'Y' : 'N';
    $('.tab--nav .tab__item').removeClass('tab__item--selected')
      .filter('[data-tab="' + tab + '"]').addClass('tab__item--selected');
    $('#tabNavigation').val(tab);
    fnGetList(1);
    return true;
  }

  function bindTabs() {
    $('.tab--nav .tab__item .tab__button').on('click', function () {
      fnChangeTab($(this).closest('.tab__item').data('tab'));
    });
    $('#tabNavigation').on('change', function () {
      if (!fnChangeTab($(this).val())) {
        $(this).val(myArtcYn === 'Y' ? 'my' : 'all');
      }
    });
  }

  // 소분류 콤보 연동: 대분류 선택 시 UP_CODE 일치 항목만 노출, 대분류 전체면 비활성
  var $subCtgryPool = $('#searchBoardItem01 option').not('[value=""]').detach();
  function fnFilterSubCtgry(ctgry) {
    var $sel = $('#searchBoardItem01');
    $sel.find('option').not('[value=""]').detach();
    if (ctgry) {
      $sel.append($subCtgryPool.filter(function () { return $(this).attr('data-up') === ctgry; }));
    }
    $sel.val('').prop('disabled', !ctgry);
  }

  // 검색/초기화 바인딩
  function bindSearch() {
    $('.board-search .button--search').on('click', function () { fnGetList(1); });
    $('#searchBoardItem00').on('change', function () { fnFilterSubCtgry($(this).val() || ''); });
    $('.board-search .button--reset').on('click', function () {
      $('#searchBoardItem00').val('');
      fnFilterSubCtgry('');
      $('#searchBoardItem02').val('');
      $('#searchBoardItem03').val('');
      fnGetList(1);
    });
    $('#searchBoardItem03').on('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); fnGetList(1); }
    });
  }

  // 등록 → initQnaEditAction.do (기존 기능 유지)
  $('#btnNewQna').on('click', function () {
    var frm = document.frm;
    frm.MODE.value = 'write';
    frm.action = '/partcptn/initQnaEditAction.do';
    frm.submit();
  });

  // 초기화
  var gridDiv = document.querySelector('#myGrid');
  gridApi = agGrid.createGrid(gridDiv, gridOptions);
  bindTabs();
  bindSearch();
  if (initSearch) $('#searchBoardItem03').val(initSearch);
  if (initCtgry) $('#searchBoardItem00').val(initCtgry);
  fnFilterSubCtgry(initCtgry);
  if (initQnagbn) $('#searchBoardItem01').val(initQnagbn);
  if (initReplyState) $('#searchBoardItem02').val(initReplyState);
  fnGetList(initPage);

  // 진입 시 AI 헬프데스크 패널 자동 오픈 — openHelpdesk 를 붙이는 ui-common.js 의 ready 핸들러 뒤로 미뤄 실행한다
  $(function () {
    setTimeout(function () {
      if (typeof window.openHelpdesk === 'function') { window.openHelpdesk(); }
    }, 0);
  });
});
</script>
