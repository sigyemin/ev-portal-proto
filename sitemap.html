<script>
/* [프로토] 사이트맵은 운영에서 세션 메뉴 트리로 서버 렌더된다 — 여기서는 menu-data.js 로 동일 구조를 그린다 */
(function () {
  var M = window.EV_MENU || [];
  var host = document.querySelector('.contents');
  if (!host || !M.length) return;
  var h = ['<div class="sitemap-wrapper"><ul class="sitemap">'];
  M.forEach(function (top) {
    h.push('<li class="sitemap__item">');
    h.push('<h2 class="sitemap__title">' + top.t + '</h2>');
    h.push('<ul class="sitemap__gnb-list">');
    top.mids.forEach(function (m) {
      h.push('<li class="sitemap__gnb-item">');
      h.push('<strong class="sitemap__gnb-link">' + m.t + '</strong>');
      h.push('<ul class="sitemap__lnb-list">');
      (m.kids || []).forEach(function (k) {
        h.push('<li><a href="' + (k.h || '#') + '">' + k.t + '</a></li>');
      });
      h.push('</ul></li>');
    });
    h.push('</ul></li>');
  });
  h.push('</ul></div>');
  host.innerHTML = h.join('');
})();
</script>
