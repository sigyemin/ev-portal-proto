<script>
var PAGE_INFO = (function () {
    try { return JSON.parse(document.getElementById('pageInfo').textContent) || {}; }
    catch (e) { return {}; }
})();

// 즐겨찾기만 보기 상태 — 목록은 1회 조회 후 { STAT_ID: 1 } 맵으로 재사용한다
var bookmarkOnly = false;
var bookmarkMap = null;

// 검색폼 값을 EvMapCore/워커가 소비하는 filters 형태로 변환
function buildEvMapFilters() {
    return {
        orgme: $('#orgme').is(':checked') ? 'Y' : 'N',
        orgetc: $('#orgetc').is(':checked') ? 'Y' : 'N',
        search: $('#searchBoardItem06').val(),
        zcode: $('#searchBoardItem01').val(),
        zscode: $('#searchBoardItem02').val(),
        statType: $('#searchBoardItem03').val(),
        is24: $('#serviceCheck1').is(':checked'),
        isSmart: $('#serviceCheck2').is(':checked'),
        band: $('#chargeTypeSelect').val(),
        bookmarkOnly: bookmarkOnly,
        bookmarkMap: bookmarkMap
    };
}

// 즐겨찾기 STAT_ID 맵을 확보한 뒤 콜백 실행 — 조회 실패 시 맵을 비워 결과가 0건이 되게 한다
function withBookmarkMap(callback) {
    if (bookmarkMap) { callback(); return; }
    $.ajax({
        type: 'post', url: EV_MAP_URLS.bookList, dataType: 'json',
        success: function (res) {
            bookmarkMap = {};
            (res && res.list ? res.list : []).forEach(function (row) {
                bookmarkMap[row.STAT_ID] = 1;
            });
            callback();
        },
        error: function () {
            bookmarkMap = {};
            callback();
        }
    });
}

// 버튼 아이콘·상태 표기를 즐겨찾기만 보기 값에 맞춘다
function syncBookmarkButton() {
    var $btn = $('.search-result > .bookmark .button--bookmark');
    $btn.attr('aria-pressed', bookmarkOnly ? 'true' : 'false');
    $btn.find('.svg-icon')
        .toggleClass('star-fill', bookmarkOnly)
        .toggleClass('star-stroke', !bookmarkOnly);
}

// 시/도 select: pageInfo.sidoList{zcode,sido} — EvMapEvView.sidoList 맵도 함께 채운다
function populateSidoSelect() {
    var $sido = $('#searchBoardItem01');
    (PAGE_INFO.sidoList || []).forEach(function (row) {
        $sido.append($('<option/>').val(row.zcode).text(row.sido));
        EvMapEvView.sidoList[row.zcode] = row.sido;
    });
}

// 시/군구 select: pageInfo.gugunList{code,gugun} 중 앞 2자리가 선택된 시/도와 일치하는 것만
function populateGugunSelect(zcode) {
    var $gugun = $('#searchBoardItem02');
    $gugun.find('option[value!=""]').remove();
    if (!zcode) return;
    (PAGE_INFO.gugunList || []).forEach(function (row) {
        if (String(row.code).substring(0, 2) === zcode) {
            $gugun.append($('<option/>').val(row.code).text(row.gugun));
        }
    });
}

// 시/군구 코드 맵은 시/도 선택과 무관하게 전체를 채워 목록/패널에서 조회 가능하게 한다
function populateGugunMap() {
    (PAGE_INFO.gugunList || []).forEach(function (row) {
        EvMapEvView.gugunList[row.code] = row.gugun;
    });
}

// 충전소 분류 select: evMapEvView.js 의 STATION_TYPE 코드표(filterFields.stationType)
function populateStationTypeSelect() {
    var $type = $('#searchBoardItem03');
    var fields = (EvMapEvView.filterFields && EvMapEvView.filterFields.stationType) || [];
    fields.forEach(function (item) {
        $type.append($('<option/>').val(item.code).text(item.label));
    });
}

$(function () {
    populateSidoSelect();
    populateGugunMap();
    populateStationTypeSelect();
    $('#searchBoardItem01').on('change', function () {
        populateGugunSelect($(this).val());
    });

    // EvMapCore.init 은 그 시점의 currentFilters() 로 로드할 파일을 1회만 결정하므로
    // 기관 구분 체크박스 초기값(둘 다 체크)을 init 이전에 seed 해야 데이터가 로드된다.
    EvMapCore.search(buildEvMapFilters());

    EvMapPanel.init(EvMapEvView, PAGE_INFO);
    EvMapList.init('.search-result__list', EvMapEvView, PAGE_INFO);
    EvMapCore.init(EvMapEvView, PAGE_INFO);
    EvMapCore.onStationsChanged(EvMapList.render);

    $('.search-form .button--search').on('click', function () {
        EvMapCore.search(buildEvMapFilters());
    });

    $('#searchBoardItem06').on('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            EvMapCore.search(buildEvMapFilters());
        }
    });

    $('.search-form .button--reset').on('click', function () {
        $('#searchBoardItem01, #searchBoardItem03, #searchBoardItem04, #chargeTypeSelect').val('');
        populateGugunSelect('');
        $('#searchBoardItem06').val('');
        $('#orgme, #orgetc').prop('checked', true);
        $('#serviceCheck1, #serviceCheck2').prop('checked', false);
        $('#autoRefreshChk').prop('checked', false).trigger('change');
        EvMapCore.search(buildEvMapFilters());
    });

    $('#autoRefreshChk').on('change', function () {
        EvMapCore.setAutoRefresh($(this).is(':checked'));
    });

    // 목록 상단 다운로드 — 서버가 미리 만들어 둔 충전소 목록 엑셀 파일을 내려받는다
    $('.search-result__list .board-toolbar__options .button--icon').on('click', function (e) {
        e.stopPropagation();
        document.getElementById('form_excel').submit();
    });

    // ui-common.js 가 같은 버튼에 직접 바인딩한 아이콘 토글이 뒤이어 실행되면 별표가 반대로 뒤집힌다
    $('.search-result > .bookmark .button--bookmark').on('click', function (e) {
        e.stopImmediatePropagation();
        if (PAGE_INFO.loginYn !== 'Y') {
            alert('로그인 후 이용할 수 있습니다.');
            return;
        }
        bookmarkOnly = !bookmarkOnly;
        syncBookmarkButton();
        withBookmarkMap(function () {
            EvMapCore.search(buildEvMapFilters());
        });
    });

    // 목록 항목 별표 상태 — 로그인 회원이면 즐겨찾기 목록을 미리 받아 목록에 반영한다
    if (PAGE_INFO.loginYn === 'Y') {
        withBookmarkMap(function () {
            EvMapList.setBookmarks(bookmarkMap);
        });
    }

    // 마이페이지에서 bookmark=Y 로 진입한 경우 즐겨찾기 목록을 받은 뒤 필터를 다시 적용한다
    if (PAGE_INFO.bookmarkOnly === 'Y') {
        bookmarkOnly = true;
        syncBookmarkButton();
        withBookmarkMap(function () {
            EvMapCore.search(buildEvMapFilters());
        });
    }
});
</script>
