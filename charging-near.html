<!-- 충전소 찾기 -->
<div class="energy-station">
  <!-- tab : 충전 유형 전환(같은 화면에서 데이터만 교체) -->
  <div class="tab">
    <ul class="tab__list">
      <li class="tab__item tab__item--selected">
        <button type="button" class="tab__button" data-near-type="ev">전기차 충전소</button>
      </li>
      <li class="tab__item">
        <button type="button" class="tab__button" data-near-type="h2">수소차 충전소</button>
      </li>
    </ul>
  </div>
  <!-- //tab -->
  <!-- 내 주변 충전소 -->
  <div class="around-station">
    <!-- 검색폼 -->
    <div class="search-form search-form--column">
      <div class="search-form__elements">
        <!-- 폼 항목 -->
        <div class="element-group">
          <div class="element-group__label">
            <span class="element-label">검색 반경</span>
          </div>
          <div class="element-group__control">
            <div class="radios">
              <div class="radio radio--chip">
                <input type="radio" id="kilometer1" name="kilometer" value="1" class="radio__input" />
                <label for="kilometer1" class="radio__label"><span>1km</span></label>
              </div>
              <div class="radio radio--chip">
                <input type="radio" id="kilometer5" name="kilometer" value="5" checked class="radio__input" />
                <label for="kilometer5" class="radio__label"><span>5km</span></label>
              </div>
              <div class="radio radio--chip">
                <input type="radio" id="kilometer10" name="kilometer" value="10" class="radio__input" />
                <label for="kilometer10" class="radio__label"><span>10km</span></label>
              </div>
              <div class="radio radio--chip">
                <input type="radio" id="kilometer20" name="kilometer" value="20" class="radio__input" />
                <label for="kilometer20" class="radio__label"><span>20km</span></label>
              </div>
            </div>
          </div>
        </div>
        <!-- //폼 항목 -->
        <!-- 전기차 전용 검색 항목 -->
        <div data-filter-type="ev">
          <!-- 폼 항목 -->
          <div class="element-group">
            <div class="element-group__label">
              <label for="evStatType" class="element-label">충전소 분류</label>
            </div>
            <div class="element-group__control">
              <select id="evStatType" class="select">
                <option value="">전체</option>
              </select>
            </div>
          </div>
          <!-- //폼 항목 -->
          <!-- 폼 항목 -->
          <div class="element-group">
            <div class="element-group__label">
              <label for="evBand" class="element-label">충전방식</label>
            </div>
            <div class="element-group__control">
              <select id="evBand" class="select">
                <option value="">전체</option>
                <option value="fast">급속</option>
                <option value="slow">완속</option>
              </select>
            </div>
          </div>
          <!-- //폼 항목 -->
          <!-- 폼 항목 -->
          <div class="element-group">
            <div class="element-group__label">
              <span class="element-label">기관 구분</span>
            </div>
            <div class="element-group__control">

                <div class="checkbox">
                  <input type="checkbox" id="orgetc" class="checkbox__input" checked />

          </div>

          <!-- 폼 항목 -->

            <div class="element-group__label">

            </div>
            <div class="element-group__control">
              <div class="checkboxs">
                <div class="checkbox">

<script>
var PAGE_INFO = (function () {
    try { return JSON.parse(document.getElementById('pageInfo').textContent) || {}; }
    catch (e) { return {}; }
})();

// 전기차 목록은 주소 없이 zcode/zscode 만 오므로 지역명 맵을 채워 목록에 표기한다
function populateRegionMaps() {
    (PAGE_INFO.sidoList || []).forEach(function (row) {
        EvMapEvView.sidoList[row.zcode] = row.sido;
    });
    (PAGE_INFO.gugunList || []).forEach(function (row) {
        EvMapEvView.gugunList[row.code] = row.gugun;
    });
}

function populateCodeSelect($select, fields, labelKey) {
    (fields || []).forEach(function (item) {
        $select.append($('<option/>').val(item.code).text(item[labelKey]));
    });
}

function buildEvFilters() {
    return {
        orgme: $('#orgme').is(':checked') ? 'Y' : 'N',
        orgetc: $('#orgetc').is(':checked') ? 'Y' : 'N',
        statType: $('#evStatType').val(),
        band: $('#evBand').val(),
        is24: $('#serviceCheck1').is(':checked'),
        isSmart: $('#serviceCheck2').is(':checked')
    };
}

function buildH2Filters() {
    return {
        oper: $('#h2Oper').val(),
        ctp: $('#h2Ctp').val(),
        vk: $('#h2Vk').val()
    };
}

$(function () {
    populateRegionMaps();
    populateCodeSelect($('#evStatType'), EvMapEvView.filterFields.stationType, 'label');
    populateCodeSelect($('#h2Oper'), EvMapH2View.filterFields.oper, 'name');
    populateCodeSelect($('#h2Ctp'), EvMapH2View.filterFields.ctp, 'name');
    populateCodeSelect($('#h2Vk'), EvMapH2View.filterFields.vk, 'name');

    EvMapNear.init(PAGE_INFO, [
        // 적재 파일은 전국 전량 고정 — 반경 판정은 워커가 좌표로 한다
        { key: 'ev', adapter: EvMapEvView, buildFilters: buildEvFilters, loadFilters: { orgme: 'Y', orgetc: 'Y' } },
        { key: 'h2', adapter: EvMapH2View, buildFilters: buildH2Filters, loadFilters: {} }
    ]);

    $('.search-form .button--reset').on('click', function () {
        $('#kilometer5').prop('checked', true);
        $('#evStatType, #evBand, #h2Oper, #h2Ctp, #h2Vk').val('');
        $('#orgme, #orgetc').prop('checked', true);
        $('#serviceCheck1, #serviceCheck2').prop('checked', false);
        EvMapNear.search();
    });
});
</script>
