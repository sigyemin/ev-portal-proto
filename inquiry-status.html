<script>
  //본인인증 팝업 오픈
  function openPCCWindow() {
    var PCC_window = window.open('', 'PCCV3Window', 'width=300, height=400, resizable=1, scrollbars=no, status=0, titlebar=0, toolbar=0, left=300, top=200');

    if (PCC_window == null) {
      alert(" ※ 팝업이 차단되어 있는 경우 화면 상단의 팝업 차단 알림을 클릭하여 팝업을 허용해 주시기 바랍니다.");
    }

    document.reqPCCForm.action = '/member/authPccRequest.do';
    document.reqPCCForm.target = 'PCCV3Window';
    document.reqPCCForm.submit();
  }

  //본인인증 후 세팅 (PCC 팝업 콜백) — 인증 성공 시 조회 화면 재진입 (세션은 서버가 이미 설정)
  function setPcc(di, no1, no2, no3, username, ci) {
    if (ci == '' || no3.length != 4) {
      alert("본인 인증에 실패 하였습니다.");
      return;
    }
    location.href = '/partcptn/initMyComplaintAction.do';
  }

  function setPccErr(msg) {
    alert(msg);
  }
</script>
