<body>
<div id="header-slot"></div>
<div class="contents-wrapper">
        <!-- 상단 공통 영역 -->
        <div class="page-header">
          <div class="page-header__inner">
            <!-- breadcrumb -->
            <nav class="breadcrumb">
              <ol class="breadcrumb__list">
                <li class="breadcrumb__item">
                  <a href="index.html" class="breadcrumb__link">
                    <i class="svg-icon home"></i>
                    <span class="hidden">홈</span>
                  </a>
                </li>
                <li class="breadcrumb__item">
                  <a href="#" class="breadcrumb__link">
                    <span>소통·지원</span>
                  </a>
                </li>
                <li class="breadcrumb__item">
                  <a href="#" class="breadcrumb__link">
                    <span>민원·문의</span>
                  </a>
                </li>
                <li class="breadcrumb__item">
                  <a href="#" class="breadcrumb__link">
                    <span>FAQ (자주 묻는 질문)</span>
                  </a>
                </li>
              </ol>
            </nav>
            <!-- subject  -->
            <div class="page-header__subject">
              <h1 class="heading-subject">FAQ (자주 묻는 질문)</h1>
            </div>
          </div>
        </div>
        <!-- 하단 각 페이지별 컨텐츠 -->
        <div class="contents">

          <!-- 자주하는질문 -->
          <div class="faq-wrapper">
            <div class="faq-search">
              <h1 class="heading-title">
                <span class="heading-title--en">AI-powered search</span>
                궁금한 것을 자연어로 질문해 보세요.
              </h1>
              <div class="element-group element-group--row">
                <div class="element-group__control">
                  <div class="text-input-icon">
                    <div class="text-input-icon__prepend">
                      <i class="svg-icon search" aria-hidden="true"></i>
                    </div>
                    <input type="text" id="faqSearchValue" class="text-input text-input--large" title="검색어" placeholder="검색어를 입력하세요.">
                  </div>
                </div>
                <button type="button" class="button button--large button--primary" id="btnFaqSearch">
                  <span class="button__label">검색</span>
                </button>
              </div>
              
              <div class="tags">
                <a href="#none" class="tag-label">보조금 신청 방법</a>
                <a href="#none" class="tag-label">충전카드 발급</a>
                <a href="#none" class="tag-label">취득세 감면</a>
                <a href="#none" class="tag-label">공모지 신청 기간</a>
                <a href="#none" class="tag-label">K-EV100 참여</a>
              </div>
            </div>
            
            <div class="faq-tab">
              <div class="tab">
                <ul class="tab__list">
                  <li class="tab__item tab__item--selected" data-smlcls=""><button type="button" class="tab__button">전체(<span class="tab__count">0</span>)</button></li>
                  <li class="tab__item" data-smlcls="1"><button type="button" class="tab__button">충전소이용(<span class="tab__count">0</span>)</button></li>
                  <li class="tab__item" data-smlcls="2"><button type="button" class="tab__button">완속충전기 설치지원 사업(<span class="tab__count">0</span>)</button></li>
                  <li class="tab__item" data-smlcls="3"><button type="button" class="tab__button">수소충전소 인프라 사업(<span class="tab__count">0</span>)</button></li>
                  <li class="tab__item" data-smlcls="4"><button type="button" class="tab__button">지킴이(<span class="tab__count">0</span>)</button></li>
                </ul>
              </div>
            </div>
            <div class="faq-list">
              <!-- accordion (목록은 selectBBSList.ajax 조회 후 동적 렌더) -->
              <div class="accordion accordion--faq" id="faqAccordion"></div>
              <!-- //accordion -->
              <!-- 검색결과 없음 -->
              <div class="data-none" id="faqNoData" style="display:none;">
                <span class="data-none__icon">
                  <i class="svg-icon infomation" aria-hidden="true"></i>
                </span>
                <strong class="data-none__title">조회된 내용이 없습니다.</strong>
              </div>
              <!-- 페이징 -->
              <div class="pagination pc-only">
                <button type="button" class="pagination__button">
                  <i class="svg-icon arrow-first"></i>
                  <span class="ir-pm">첫 페이지</span>
                </button>
                <button type="button" class="pagination__button">
                  <i class="svg-icon arrow-prev"></i>
                  <span class="ir-pm">이전</span>
                </button>
                <div class="pagination__list"></div>
                <button type="button" class="pagination__button">
                  <i class="svg-icon arrow-next"></i>
                  <span class="ir-pm">다음</span>
                </button>
                <button type="button" class="pagination__button">
                  <i class="svg-icon arrow-last"></i>
                  <span class="ir-pm">마지막 페이지</span>
                </button>
              </div>
              <!-- 모바일 전용 -->
              <div class="pagination pagination--fraction">
                <button type="button" class="pagination__button">
                  <i class="svg-icon arrow-prev"></i>
                  <span>이전</span>
                </button>
                <div class="pagination__text">
                  <span class="pagination__current">1</span>
                  <span class="pagination__total">1</span>
                </div>
                <button type="button" class="pagination__button">
                  <span>다음</span>
                  <i class="svg-icon arrow-next"></i>
                </button>
              </div>
              <!-- //페이징 -->
            </div>
          </div>
          <!-- //자주하는질문 -->

        </div>
      </div>

<script>
$(function () {
  var curPage = 1;
  var PER_PAGE = 10;
  var curSmlcls = ''; // 선택된 분류 탭 ('' = 전체)

  // FAQ 분류명 (ARTC.SMLCLS10 — null 은 1(충전소 이용)로 취급, 구 화면 로직 유지)
  var CATEGORY = { '1': '충전소 이용', '2': '완속충전기 설치지원 사업', '3': '수소충전소 인프라 사업', '4': '지킴이' };

  function fnEscape(s) {
    return $('<span>').text(s == null ? '' : String(s)).html();
  }

  // 목록 조회 (기존 selectBBSList.ajax 서버사이드 페이징/검색 그대로 사용)
  function fnGetList(pageNo) {
    curPage = pageNo || 1;
    $.ajax({
      type: 'post',
      url: '/infoGarden/selectBBSList.ajax',
      dataType: 'json',
      data: {
        BLBD_ID: 'faq',
        spageNo: curPage,
        srecordCountPerPage: PER_PAGE,
        spageSize: 10,
        searchType: 'conAndtit',
        searchValue: $.trim($('#faqSearchValue').val() || ''),
        SMLCLS10: curSmlcls
      },
      success: function (obj) {
        var list = (obj && obj.list) ? obj.list : [];
        fnDrawList(list);
        var page = (obj && obj.page) ? obj.page : {};
        var total = Number(page._listCount) || 0;
        fnRenderPaging(total, Number(page._pageNo) || curPage, Number(page._recordCountPerPage) || PER_PAGE);
      }
    });
  }

  // 아코디언 목록 렌더
  function fnDrawList(list) {
    var $acc = $('#faqAccordion');
    $acc.empty();

    if (!list.length) {
      $('#faqNoData').show();
      $('.faq-list .pagination').css('display', 'none');
      return;
    }
    $('#faqNoData').hide();
    $('.faq-list .pagination').css('display', '');

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var row = list[i];
      var catNm = CATEGORY[row.SMLCLS10] || CATEGORY['1'];
      var hId = 'faqAccHeader' + row.ARTC_ID;
      var pId = 'faqAccPanel' + row.ARTC_ID;
      html += '<div class="accordion-item">';
      html += '  <h3 class="accordion-header">';
      html += '    <button type="button" id="' + hId + '" class="accordion-button" aria-controls="' + pId + '">';
      html += '      [' + fnEscape(catNm) + '] ' + fnEscape(row.TITL);
      html += '    </button>';
      html += '  </h3>';
      html += '  <div id="' + pId + '" class="accordion-collapse" aria-labelledby="' + hId + '" style="display:none;">';
      // 답변 내용은 관리자 작성 HTML(<br>, 이미지 등) 포함 — 구 화면과 동일하게 원문 렌더
      html += '    <div class="accordion-content">' + (row.ARTC_CNTNS == null ? '' : row.ARTC_CNTNS) + '</div>';
      html += '  </div>';
      html += '</div>';
    }
    $acc.append(html);
  }

  // 분류 탭별 게시글 수 (초기 1회 조회 — srecordCountPerPage 최소화로 건수만 사용)
  function fnLoadCounts() {
    $('.faq-tab .tab__item').each(function () {
      var $item = $(this);
      $.ajax({
        type: 'post',
        url: '/infoGarden/selectBBSList.ajax',
        dataType: 'json',
        data: {
          BLBD_ID: 'faq',
          spageNo: 1,
          srecordCountPerPage: 1,
          spageSize: 1,
          SMLCLS10: String($item.data('smlcls') == null ? '' : $item.data('smlcls'))
        },
        success: function (obj) {
          var total = (obj && obj.page && Number(obj.page._listCount)) || 0;
          $item.find('.tab__count').text(total);
        }
      });
    });
  }

  // 페이지네이션 렌더 (버튼순서 [첫,이전,다음,마지막])
  function fnRenderPaging(listCount, current, perPage) {
    var totalPages = Math.max(1, Math.ceil(listCount / perPage));
    if (current > totalPages) current = totalPages;

    var $pc = $('.faq-list .pagination.pc-only');
    var $list = $pc.find('.pagination__list');
    var block = Math.floor((current - 1) / 10);
    var start = block * 10 + 1;
    var end = Math.min(start + 9, totalPages);

    var html = '';
    for (var p = start; p <= end; p++) {
      html += '<a href="#none" class="pagination__link' + (p === current ? ' pagination__link--selected' : '') + '" data-page="' + p + '">' + p + '</a>';
    }
    $list.html(html);

    var $btns = $pc.find('.pagination__button');
    $btns.eq(0).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(1); });
    $btns.eq(1).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(current - 1); });
    $btns.eq(2).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(current + 1); });
    $btns.eq(3).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(totalPages); });
    $list.find('.pagination__link').off('click.pg').on('click.pg', function (e) {
      e.preventDefault(); fnGetList(Number($(this).data('page')));
    });

    var $frac = $('.faq-list .pagination--fraction');
    $frac.find('.pagination__current').text(current);
    $frac.find('.pagination__total').text(totalPages);
    $frac.find('.pagination__button').eq(0).off('click.pg').on('click.pg', function () { if (current > 1) fnGetList(current - 1); });
    $frac.find('.pagination__button').eq(1).off('click.pg').on('click.pg', function () { if (current < totalPages) fnGetList(current + 1); });
  }

  // 분류 탭 전환
  $('.faq-tab .tab__button').on('click', function () {
    var $item = $(this).closest('.tab__item');
    $('.faq-tab .tab__item').removeClass('tab__item--selected');
    $item.addClass('tab__item--selected');
    curSmlcls = String($item.data('smlcls') == null ? '' : $item.data('smlcls'));
    fnGetList(1);
  });

  // 목록은 조회 후 그려져 ui-common.js 의 로드 시점 accordion 바인딩에서 빠진다 — 위임으로 토글 처리
  $('#faqAccordion').on('click', '.accordion-button', function () {
    var $item = $(this).closest('.accordion-item');
    $item.find('.accordion-collapse').slideToggle(300, function () {
      $item.toggleClass('accordion-item--expanded');
    });
  });

  // 검색 / 추천 검색어 태그
  $('#btnFaqSearch').on('click', function () { fnGetList(1); });
  $('#faqSearchValue').on('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); fnGetList(1); }
  });
  $('.faq-search .tag-label').on('click', function (e) {
    e.preventDefault();
    $('#faqSearchValue').val($(this).text());
    fnGetList(1);
  });

  // 초기화
  fnLoadCounts();
  fnGetList(1);

  // 진입 시 AI 헬프데스크 패널 자동 오픈 — openHelpdesk 를 붙이는 ui-common.js 의 ready 핸들러 뒤로 미뤄 실행한다
  $(function () {
    setTimeout(function () {
      if (typeof window.openHelpdesk === 'function') { window.openHelpdesk(); }
    }, 0);
  });

  
});
</script>
