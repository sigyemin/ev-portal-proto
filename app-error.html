<div id="footer-slot"></div>
<script src="js/partials.js?v=20260724a"></script>

<script>
(function(){
  // i18n 등록(페이지 로컬)
  if(window.__i18n && __i18n.register){
    __i18n.register({
      'app.err.login.h':  { ko:'로그인이 필요합니다', en:'Login required' },
      'app.err.login.p':  { ko:'앱에서 로그인 후 이용할 수 있는 화면입니다. 로그인 상태가 만료되었거나 인증되지 않았습니다. 다시 로그인해 주세요.',
                            en:'This screen requires an app login. Your session has expired or you are not authenticated. Please sign in again.' },
      'app.err.login.cta':{ ko:'로그인하기', en:'Sign in' },
      'app.err.access.h': { ko:'접근 권한이 없습니다', en:'Access denied' },
      'app.err.access.p': { ko:'이 화면에 접근할 권한이 없습니다. 권한이 필요한 경우 관리자에게 문의해 주세요.',
                            en:'You do not have permission to access this screen. If you need access, please contact the administrator.' },
      'app.err.access.cta':{ ko:'이전으로', en:'Go back' },
      'app.err.home':     { ko:'홈으로', en:'Home' }
    });
  }
  // ?type=login(기본)|access 분기
  var type = (new URL(location.href).searchParams.get('type') || 'login').toLowerCase();
  if(type === 'access'){
    var setI = function(id, key){ var el=document.getElementById(id); if(el){ el.setAttribute('data-i18n', key); } };
    setI('apperrH','app.err.access.h'); setI('apperrP','app.err.access.p'); setI('apperrCta','app.err.access.cta');
    var cta=document.getElementById('apperrCta'); if(cta){ cta.setAttribute('href','javascript:history.length>1?history.back():location.assign("index.html")'); }
    document.title = '접근 권한 오류 (앱) | 무공해차 통합누리집';
    var code=document.getElementById('apperrCode'); if(code) code.textContent = '오류 유형: 접근 거부 (APP-ACCESS-DENIED)';
  }
  if(window.__i18n && __i18n.applyLang) __i18n.applyLang(__i18n.getLang());
})();
</script>
